name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token is read/write on a public repo; nothing here needs to
# write anything.
permissions:
  contents: read

# Successive pushes to the same branch supersede each other instead of
# queueing up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved
      # under us, a SHA cannot. Comments carry the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      # tests/ is hermetic by construction (tmp_path stands in for the target
      # workspace, no network, no API key), which is why no secrets are
      # configured for this job. evals/ is deliberately NOT run here: it calls
      # a real model against a real corpus, costs money per run, and is scored
      # against thresholds rather than passing or failing. That belongs in its
      # own opt-in job with its own secrets — the split this comment used to
      # name as a future trigger, now taken.
      - run: uv sync --extra dev
      # Through the make target, not a second spelling of the same command.
      # The Makefile calls `test` the CI gate; two copies of that intent drift,
      # and the one CI runs wins silently. This makes the documented gate the
      # executed one.
      - run: make test
      # Free, deterministic, no network and no model: it compares the golden
      # set's sha256 to evals/golden.lock.json. The suite above already fails
      # on a changed set, so this is the wider check — it also catches a lock
      # whose version or counts drifted from the bytes they claim to describe.
      - run: make golden-check
