[project]
name = "ticket-to-pr-agent"
version = "0.1.0"
description = "A coding agent that turns a GitHub Issue into a tested, CI-ready pull request"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Model access: the raw Anthropic SDK (Messages API). We write the
    # tool-calling loop ourselves (plain function-calling loop, no framework)
    # so the agent mechanism stays 100% ours.
    # No LiteLLM (a multi-provider layer we don't need) and no LangGraph
    # (a loop framework that would hide what we're here to learn).
    "anthropic>=0.69",
    # Service layer (agent/service.py): /health + /v1/chat around the same
    # AgentRuntime agent/cli.py uses (agent/factory.py builds both). Removed
    # after hello_agent.py's retirement, then reinstated: the service surface
    # (/health plus one structured log line per turn) was never optional —
    # only the throwaway file that first implemented it was.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # GitHub REST calls, hand-written (SPEC.md's POC default — PyGithub is
    # the named production upgrade, not needed yet).
    "httpx>=0.27",
    # Validates tool_use.input against a Tool's input_schema before the
    # handler ever runs (a policy guard, not a mechanic we're here to
    # learn — unlike the GitHub calls, reinventing a JSON Schema validator
    # would just be reinventing a solved problem).
    "jsonschema>=4.23",
    "mcp[cli]>=2.2.0",
    "huggingface-hub>=1.31.0",
    "sqlite-vec>=0.1.9",
    "numpy>=2.5.3",
    "pypdf>=6.18.1",
]

[project.optional-dependencies]
# Pulled in when retrieval over the knowledge-base corpus goes real.
# Kept out of the base install so the service boots with zero DB dependencies.
rag = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.3",
    # evals/gates.py reads the thresholds file, and tests/ asserts against it.
    # Declared rather than inherited: it arrives transitively today, and a
    # transitive dependency disappears when its parent drops it — here that
    # would take the CI gate's own config parser with it.
    "pyyaml>=6.0",
    "ruff>=0.8",
]

# An application, not an installable library — uv manages the venv + deps
# but does not build/install the project itself. Decomposed into agent/ and
# tools/ packages; still no build backend, since nothing
# consumes this as an installed dependency.
[tool.uv]
package = false

[tool.ruff]
# One definition of the lint, read by `make lint`, by CI and by the pre-push hook.
# Before this, ruff run from outside the project reported a different count
# depending on whose defaults it picked up, which is no gate at all.
line-length = 120
extend-exclude = ["shadow/clones"]

[tool.ruff.lint]
# E, F: errors and pyflakes, which is where a name that does not exist is found.
# I: import order. B: bugbear, for the zip() that silently drops an unpaired item,
# which this repo has already paid for once. UP: syntax the supported Python no
# longer needs.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # `l` over lines of text, in comprehensions and tests. A rename across forty
    # sites to satisfy a style rule is churn with a typo risk and catches nothing.
    "E741",
    # An assigned lambda in a test helper reads better than a def of the same
    # three tokens, and has never hidden a defect here.
    "E731",
    # Semicolons in tests that set up a fixture on one line.
    "E702",
    # ErrorClass is (str, Enum), not StrEnum, on purpose: the typed error codes are
    # built with str() and f-strings, and StrEnum changes what str() gives for a
    # member. Not worth a behaviour change in the error taxonomy for a style rule.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# An HTML page held in Python strings, and a smoke set of long query strings.
# Wrapping either changes what is rendered or asked.
"shadow/review.py" = ["E501"]
"evals/test_rag_smoke_set.py" = ["E501"]

[tool.pytest.ini_options]
# tests/ only. evals/ is a different thing that costs money to run and is
# scored against thresholds rather than passing or failing — see evals/README.md.
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]         # so tests can `import agent.*` / `import tools.*` from the repo root
