[project]
name = "ticket-to-pr-agent"
version = "0.1.0"
description = "A coding agent that turns a GitHub Issue into a tested, CI-ready pull request"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Model access: the raw Anthropic SDK (Messages API). We write the
    # tool-calling loop ourselves (plain function-calling loop, no framework)
    # so the agent mechanism stays 100% ours — that is the point of Days 3 & 5.
    # No LiteLLM (a multi-provider layer we don't need) and no LangGraph
    # (a loop framework that would hide what we're here to learn).
    "anthropic>=0.69",
    # GitHub REST calls, hand-written (SPEC.md's POC default — PyGithub is
    # the named production upgrade, not needed yet).
    "httpx>=0.27",
    # Validates tool_use.input against a Tool's input_schema before the
    # handler ever runs (a policy guard, not a mechanic we're here to
    # learn — unlike the GitHub calls, reinventing a JSON Schema validator
    # would just be reinventing a solved problem).
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# Pulled in on Day 4 when retrieval over the liberty-rider corpus goes real.
# Kept out of the base install so the service boots with zero DB dependencies.
rag = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.3",
]

# An application, not an installable library — uv manages the venv + deps
# but does not build/install the project itself. Decomposed into agent/ and
# tools/ packages since Day 3; still no build backend, since nothing
# consumes this as an installed dependency.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["evals"]
addopts = "-q"
pythonpath = ["."]         # so tests can `import agent.*` / `import tools.*` from the repo root
